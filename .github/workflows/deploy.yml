name: 🚀 Deploy — Cloudflare Pages & Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public/index.html exists and has content
        run: |
          [ -f public/index.html ] || (echo "❌ index.html missing" && exit 1)
          SIZE=$(wc -c < public/index.html)
          [ "$SIZE" -gt 50000 ] || (echo "❌ File too small: ${SIZE} bytes" && exit 1)
          echo "✅ index.html OK — ${SIZE} bytes"
      - name: Check all required pages exist
        run: |
          for f in login.html admin.html support.html faq.html privacy.html; do
            [ -f "public/$f" ] && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done

  deploy-cloudflare:
    name: ☁️ Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: salon-dashboard
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-vercel:
    name: ▲ Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  preview:
    name: 🔍 Preview (PR)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Preview
        uses: cloudflare/pages-action@v1
        id: cf
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: salon-dashboard
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Ready\n| ☁️ Cloudflare | ${{ steps.cf.outputs.url }} |\n|---|---|\n_Commit: \`${{ github.sha }}\`_`
            })
