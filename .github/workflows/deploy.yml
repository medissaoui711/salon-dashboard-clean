name: 🚀 Deploy — Cloudflare Pages & Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Validate ──────────────────────────────────────────────
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all required pages exist
        run: |
          for f in index.html login.html admin.html support.html faq.html privacy.html; do
            if [ -f "public/$f" ]; then
              echo "✅ $f ($(wc -c < public/$f) bytes)"
            else
              echo "❌ $f missing" && exit 1
            fi
          done

      - name: Check index.html is not empty
        run: |
          SIZE=$(wc -c < public/index.html)
          [ "$SIZE" -gt 50000 ] || (echo "❌ index.html too small: ${SIZE}" && exit 1)
          echo "✅ index.html size OK: ${SIZE} bytes"

  # ── 2. Deploy to Cloudflare Pages ────────────────────────────
  deploy-cloudflare:
    name: ☁️ Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: salon-dashboard
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Deploy to Vercel ──────────────────────────────────────
  deploy-vercel:
    name: ▲ Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── 4. Preview on PRs ────────────────────────────────────────
  preview:
    name: 🔍 Preview (PR)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Preview to Cloudflare
        uses: cloudflare/pages-action@v1
        id: cf
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: salon-dashboard
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Ready\n\n| ☁️ Cloudflare | ${{ steps.cf.outputs.url }} |\n|---|---|\n\n_Commit: \`${{ github.sha }}\`_`
            })
